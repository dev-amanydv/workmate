services:
  mysql:
    image: mysql:8
    container_name: workmate-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workmate}
      MYSQL_USER: ${MYSQL_USER:-workmate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-workmate}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: workmate-backend:latest
    container_name: workmate-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-workmate}:${MYSQL_PASSWORD:-workmate}@mysql:3306/${MYSQL_DATABASE:-workmate}
      FRONTEND_URL: ${FRONTEND_URL:-https://workmate.amanydv.in}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-none}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-workmate_jwt_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-workmate_jwt_refresh_secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-1209600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/api/auth/google/callback}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-placeholder_account_id}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-placeholder_access_key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-placeholder_secret_key}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-workmate}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://pub-workmate.r2.dev}
      UPLOADS_DIR: ${UPLOADS_DIR:-./uploads}
      LOCAL_STORAGE_BASE_URL: ${LOCAL_STORAGE_BASE_URL:-http://localhost:4000}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/apps/backend/uploads

volumes:
  mysql-data:
  backend-uploads:
